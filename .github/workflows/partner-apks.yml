name: Vendor and Delivery APKs

on:
  push:
    branches: [build/partner-apks-20261031]
    paths:
      - 'apps/vendor_app/**'
      - 'apps/driver_app/**'
      - 'packages/**'
      - 'scripts/clerk/**'
      - '.github/workflows/partner-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: vendor
            onboarding: clerk_vendor_onboarding_test.dart
          - role: driver
            onboarding: clerk_rider_onboarding_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install Android verification tools
        run: |
          mkdir -p build/ci
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 2>&1 | tee build/ci/android-tools.log
      - name: Complete app analysis and regression suite
        env:
          GROZO_FLUTTER_TEST_JSON: ${{ github.workspace }}/build/ci/flutter-${{ matrix.role }}.jsonl
        run: bash scripts/check_flutter.sh ${{ matrix.role }}
      - name: Clerk token and partner onboarding regressions
        working-directory: apps/${{ matrix.role }}_app
        run: |
          set -o pipefail
          flutter test --no-pub --dart-define=AUTH_MODE=clerk-test \
            test/clerk_api_tokens_test.dart test/${{ matrix.onboarding }} --machine \
            | tee ../../build/ci/clerk-${{ matrix.role }}.jsonl
      - name: Build connected preview from committed source
        run: |
          python3 scripts/clerk/build_test_apks.py --app ${{ matrix.role }} \
            --public-config Docs/clerk/android-staging-public.json \
            --backend-origin https://grozo-backend-3wdf.onrender.com \
            --build-name 1.16.3 --build-number 27
      - name: Verify APK and record development signing compatibility
        run: python3 scripts/clerk/verify_apks.py --app ${{ matrix.role }} --allow-development-key-rotation
      - name: Assemble the verified publication bundle
        run: |
          mkdir -p build/partner-publication
          cp build/clerk-test-apks/*.apk build/clerk-test-apks/manifest.json build/clerk-test-apks/SHA256SUMS build/partner-publication/
          cp build/ci/flutter-${{ matrix.role }}.jsonl build/ci/clerk-${{ matrix.role }}.jsonl build/partner-publication/
      - name: Preserve complete test and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-evidence-${{ matrix.role }}-${{ github.sha }}
          path: |
            build/ci/
            build/clerk-test-apks/*-build.log
            build/clerk-test-apks/*-build.json
            build/clerk-test-apks/*-apk-verification.txt
          if-no-files-found: warn
      - name: Publish bounded failure diagnostics
        if: failure()
        env:
          APP_ROLE: ${{ matrix.role }}
        run: |
          python3 scripts/qa/report_flutter_results.py build/ci/flutter-${{ matrix.role }}.jsonl
          python3 scripts/qa/report_flutter_results.py build/ci/clerk-${{ matrix.role }}.jsonl
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in [Path('build/ci/android-tools.log'), Path('build/clerk-test-apks') / (os.environ['APP_ROLE'] + '-build.log')]:
              if path.exists():
                  message = (str(path) + '\n' + path.read_text(errors='replace')[-14000:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::notice::' + message)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partner-apk-${{ matrix.role }}-${{ github.sha }}
          path: build/partner-publication/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.repository == 'MohdKabir958/bilnkit-clone' && github.ref == 'refs/heads/build/partner-apks-20261031'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifacts/grozo-android-preview
          path: archive
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: partner-apk-*-${{ github.sha }}
          path: incoming
      - name: Publish both verified apps without changing deployed branches
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          archive = pathlib.Path('archive')
          relative = pathlib.Path('clerk-staging') / ('partners-1.16.3-27-' + os.environ['SOURCE_COMMIT'][:7])
          destination = archive / relative
          destination.mkdir(parents=True, exist_ok=False)
          records = []
          summaries = []
          for role, label in [('vendor', 'Vendor'), ('driver', 'Delivery')]:
              incoming = pathlib.Path('incoming') / ('partner-apk-' + role + '-' + os.environ['SOURCE_COMMIT'])
              manifest = json.loads((incoming / 'manifest.json').read_text())
              assert len(manifest) == 1
              record = manifest[0]
              assert record['buildCommit'] == os.environ['SOURCE_COMMIT']
              assert record['applicationId'] == 'in.grozo.' + role
              assert record['authMode'] == 'clerk-test' and not record['authenticationPreview']
              assert record['versionName'] == '1.16.3' and record['versionCode'] == 2027
              assert record['apiOrigin'] == 'https://grozo-backend-3wdf.onrender.com'
              apk = incoming / ('Grozo-' + label + '-Clerk-Test.apk')
              assert hashlib.sha256(apk.read_bytes()).hexdigest() == record['sha256']
              shutil.copy2(apk, destination / apk.name)
              for name in ['flutter-' + role + '.jsonl', 'clerk-' + role + '.jsonl']:
                  shutil.copy2(incoming / name, destination / name)
                  events = [json.loads(line) for line in (incoming / name).read_text().splitlines() if line.startswith('{')]
                  done = [event for event in events if event.get('type') == 'done']
                  assert done and done[-1]['success'] is True
                  results = [event for event in events if event.get('type') == 'testDone' and not event.get('hidden', False)]
                  summary = {'role':role, 'suite':name, 'passed':sum(event.get('result') == 'success' and not event.get('skipped', False) for event in results), 'failed':sum(event.get('result') in ('failure','error') for event in results), 'skipped':sum(bool(event.get('skipped')) for event in results), 'success':True}
                  summaries.append(summary)
              records.append(record)
              (archive / ('latest-' + role + '.json')).write_text(json.dumps(
                  {'path':str(relative / apk.name), 'sourceCommit':os.environ['SOURCE_COMMIT'],
                   'versionName':'1.16.3', 'versionCode':2027, 'sha256':record['sha256'],
                   'inPlaceUpdateCompatible':record['inPlaceUpdateCompatible']}, indent=2) + '\n')
          (destination / 'manifest.json').write_text(json.dumps(records, indent=2) + '\n')
          (destination / 'test-results.json').write_text(json.dumps(summaries, indent=2) + '\n')
          (destination / 'SHA256SUMS').write_text(''.join(record['sha256'] + '  ' + record['filename'] + '\n' for record in records))
          (destination / 'INSTALL.txt').write_text(
              'Grozo Vendor and Delivery 1.16.3, ARM64 Android API 24+ previews.\n'
              'Backend: https://grozo-backend-3wdf.onrender.com/api; Clerk development sign-in.\n'
              'New development signing certificates: preserve needed local data, uninstall the older previews, then install and sign in again. Uninstalling clears local app data; backend records remain.\n'
              'Vendor/rider admin approval and configured service locations remain required. No demo login or automatic store/account claim is provided.\n'
              'Firebase push is unconfigured in these previews; they are not Play Store releases.\n')
          PY
          git -C archive config user.name 'github-actions[bot]'
          git -C archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C archive add clerk-staging latest-vendor.json latest-driver.json
          git -C archive commit -m "Publish verified Vendor and Delivery previews from ${SOURCE_COMMIT}"
          git -C archive push origin HEAD:refs/heads/artifacts/grozo-android-preview
          export ARTIFACT_COMMIT="$(git -C archive rev-parse HEAD)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for role in ['vendor','driver']:
                  record = json.loads(Path('archive/latest-' + role + '.json').read_text())
                  url = 'https://raw.githubusercontent.com/MohdKabir958/bilnkit-clone/' + os.environ['ARTIFACT_COMMIT'] + '/' + record['path']
                  out.write(f"{role}: {url}\n\nSHA-256: `{record['sha256']}`\n\n")
                  print(role + ': ' + url)
          print('Artifact commit: ' + os.environ['ARTIFACT_COMMIT'])
          PY
