name: Baseline development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/market_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run build
      - run: npm test -- --silent
      - run: npm audit --omit=dev
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [super_admin, landing]
    defaults:
      run:
        working-directory: web/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
      - if: matrix.component == 'super_admin'
        run: npm test
      - run: python3 ../../scripts/configure_brand.py --check
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [customer, vendor, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: bash scripts/check_flutter.sh ${{ matrix.role }}
